name: Fetch running data

# Runs the same node fetch-data.js you'd run locally, on a schedule, so nobody has to
# remember to do it. Everything fetch-data.js writes goes straight to Supabase (see
# supabase.js) — there is nothing to check out or push back to a git repo, so this
# workflow only needs Supabase + Intervals.icu credentials as secrets.

on:
  schedule:
    # Offset from :00 on purpose — GitHub's own docs warn that the top of every hour is
    # the highest-load time for the schedule event and gets delayed most, sometimes by
    # hours (confirmed here: actual gaps between runs were 6-11.5h instead of a clean 6).
    - cron: "17 */6 * * *" # every 6 hours, at :17 past to dodge the top-of-hour queue
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Fetch latest activities
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          ATHLETES_JSON: ${{ secrets.ATHLETES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node fetch-data.js
